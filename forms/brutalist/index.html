<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Brutalist Login Form</title>
    <meta name="description" content="Bold, raw brutalist login design with stark typography and chunky borders.">
    <meta name="author" content="Aigars Silkalns / Colorlib">
    <link rel="canonical" href="https://puikinsh.github.io/login-forms/forms/brutalist/">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%236366f1'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='system-ui,sans-serif'>L</text></svg>">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Brutalist Login Form">
    <meta property="og:description" content="Bold, raw brutalist login design with stark typography and chunky borders.">
    <meta property="og:url" content="https://puikinsh.github.io/login-forms/forms/brutalist/">
    <meta property="og:image" content="https://puikinsh.github.io/login-forms/assets/screenshots/brutalist.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Brutalist Login Form">
    <meta name="twitter:description" content="Bold, raw brutalist login design with stark typography and chunky borders.">
    <meta name="twitter:image" content="https://puikinsh.github.io/login-forms/assets/screenshots/brutalist.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <div class="logo-square"></div>
                </div>
                <h2>Sign In</h2>
                <p>Enter your credentials</p>
            </div>
            
            <form class="login-form" id="loginForm" method="post" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" required autocomplete="username" aria-describedby="emailError" autocapitalize="none" spellcheck="false" placeholder=" ">
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper password-wrapper">
                        <input type="password" id="password" name="password" required autocomplete="current-password" aria-describedby="passwordError" placeholder=" ">
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" aria-pressed="false">
                            <span class="toggle-text">SHOW</span>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-options">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember" class="checkbox-label">
                            <div class="checkbox-box"></div>
                            <span>Remember me</span>
                        </label>
                    </div>
                    <a href="reset-password.html" class="forgot-link" data-action="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">SIGN IN</span>
                    <div class="btn-loader">
                        <div class="loader-bar"></div>
                        <div class="loader-bar"></div>
                        <div class="loader-bar"></div>
                    </div>
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-login">
                <button type="button" class="social-btn" data-action="social" data-provider="Google">
                    <span class="social-text">GOOGLE</span>
                </button>
                <button type="button" class="social-btn" data-action="social" data-provider="GitHub">
                    <span class="social-text">GITHUB</span>
                </button>
            </div>

            <div class="signup-link">
                <span>No account? </span>
                <a href="sign-up.html" data-action="signup">Create one</a>
            </div>

            <div class="success-message" id="successMessage" tabindex="-1">
                <div class="success-icon">✓</div>
                <h3>Success</h3>
                <p>Sign-in demo complete. No session was created and no redirect will occur.</p>
            </div>
        </div>
    </div>

    <script src="../../shared/js/form-utils.js"></script>
    <script src="script.js"></script>
</body>
</html>
