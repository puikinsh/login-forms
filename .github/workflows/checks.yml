name: Template quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
  browsers:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    name: ${{ matrix.project || matrix.browser }} (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1/3, 2/3, 3/3]
        include:
          - project: visual-desktop
            browser: chromium
            shard: 1/1
          - project: visual-mobile
            browser: chromium
            shard: 1/1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps "${{ matrix.browser }}"
      - run: npx playwright test --project="${{ matrix.project || matrix.browser }}" --shard="${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.project || matrix.browser }}-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 14
